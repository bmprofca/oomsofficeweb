<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A73E8" />
    <meta
      name="description"
      content="OOMS — Office Operations Management System"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>OOMS</title>
    <script>
      // Must run before webpack-dev-server client so opaque rejections never open the CRA overlay.
      (function () {
        function isOpaque(reason, message) {
          if (message === '[object Object]') return true;
          if (reason instanceof Error) return reason.message === '[object Object]';
          return !!(reason && typeof reason === 'object');
        }
        function suppress(event) {
          var reason = event.reason !== undefined ? event.reason : event.error;
          var message = event.message || (reason && reason.message) || '';
          if (!isOpaque(reason, message)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          if (typeof console !== 'undefined' && console.warn) {
            console.warn('[OOMS] Suppressed opaque runtime error:', reason || message);
          }
        }
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);
      })();
    </script>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
